[tools]
java = "25"
maven = "3"
node = "24"
pnpm = "12.6.0"

# 保留 Compose 生命周期、组合步骤或较长固定参数的任务；其他简单命令直接调用项目工具。

[tasks.verify]
description = "严格验证源码结构、后端格式与全部测试，以及全部前端包（需要 Docker）"
run = [
    "node --test scripts/source-lines.test.mjs scripts/frontend-boundaries.test.mjs scripts/verify-integration.test.mjs",
    "node scripts/source-lines.mjs",
    "node scripts/verify-integration.mjs docker",
    "mvn -f server/pom.xml clean spotless:check test",
    "node scripts/verify-integration.mjs reports",
    "pnpm --dir frontend run ready",
]

[tasks.install]
description = "安装前端依赖并下载后端 Maven 依赖"
depends = ["install:server", "install:frontend"]

# 单行依赖命令仅作为 install 的内部并行步骤，不出现在任务列表中。
[tasks."install:server"]
hide = true
dir = "server"
run = "mvn dependency:resolve"

[tasks."install:frontend"]
hide = true
dir = "frontend"
run = "pnpm install"

[tasks.dev]
description = "同时启动后端和 PC 前端开发服务"
depends = ["dev:server", "dev:frontend"]

# 单行启动命令仅作为 dev 的内部并行步骤，不出现在任务列表中。
[tasks."dev:server"]
hide = true
dir = "server"
run = "mvn spring-boot:run"

[tasks."dev:frontend"]
hide = true
dir = "frontend"
run = "pnpm run dev:web"

[tasks."infra:up"]
description = "启动或恢复本地 PostgreSQL 和 RustFS"
run = "docker compose -f deploy/compose.dev.yaml up -d --wait --no-recreate"

[tasks."infra:stop"]
description = "停止本地 PostgreSQL 和 RustFS，保留容器及数据"
run = "docker compose -f deploy/compose.dev.yaml stop"

[tasks."infra:down"]
description = "停止并删除本地 PostgreSQL 和 RustFS 容器及 Compose 网络"
run = "docker compose -f deploy/compose.dev.yaml down"

[tasks."frontend:deprecated:check"]
description = "检查前端过时 API 使用"
dir = "frontend"
run = [
    "pnpm --filter @archive-management/frontend-core run check:deprecated",
    "pnpm --filter @archive-management/web run check:deprecated",
]

[tasks."server:deprecated:check"]
description = "检查 server 过时 API 使用"
dir = "server"
run = "mvn -Drewrite.activeRecipes=org.openrewrite.java.search.FindDeprecatedUses -Drewrite.exportDatatables=true rewrite:dryRun"
